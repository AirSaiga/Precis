version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # 根 overrides 钉版（vue 3.5.22 / vue-tsc 3.1.1，原因见 /frontend 条注释），不接收升级 PR
      - dependency-name: "vue"
      - dependency-name: "vue-tsc"
      # 大版本升级一律走专项任务，不开日常 PR（2026-10 起的人肉策略固化）
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # 钉版依赖，不接收升级 PR：
      # - vue 钉在 3.5.22（>=3.5.23 触发 TS2589 类型深度爆炸）
      # - vue-tsc 钉在 3.1.1（3.3.x 会向 src/ emit .js 产物）
      - dependency-name: "vue"
      - dependency-name: "vue-tsc"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "npm"
    directory: "/electron"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "electron"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"
