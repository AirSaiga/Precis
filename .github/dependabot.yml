version: 2

# npm workspaces 说明：只配根目录 "/" 一条 npm 生态——dependabot 的根目录
# 条目能正确联动 workspace 子包 manifest 与根 package-lock.json；为 /frontend、
# /electron 单独配置的条目够不到根 lockfile，只会开出 "npm ci lockfile 不同步"
# 的坏 PR 或与根条目重复（实证：子目录条目开出的 PR 全部被关闭、零合并，已移除）。
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # 钉版依赖（根 package.json overrides），不接收升级 PR：
      # - vue 钉在 3.5.22（>=3.5.23 触发 TS2589 类型深度爆炸）
      # - vue-tsc 钉在 3.1.1（3.3.x 会向 src/ emit .js 产物）
      - dependency-name: "vue"
      - dependency-name: "vue-tsc"
      # 大版本升级一律走专项任务，不开日常 PR（2026-10 起的人肉策略固化）
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"
