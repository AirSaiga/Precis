name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # 强制 GitHub Actions 使用 Node.js 24 运行 action，消除 Node 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npm run type-check

      - name: Test with coverage
        run: npm run test -- --coverage

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Build
        run: npm run build-only

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  backend:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: python -m ruff check app

      - name: Ruff format check
        run: python -m ruff format --check app

      - name: mypy type check
        run: python -m mypy app

      - name: Audit dependencies
        run: |
          pip install pip-audit
          pip-audit --desc --format=markdown

      - name: Run unit + integration tests with coverage
        run: python -m pytest --cov=app --cov-fail-under=67 --cov-report=html --cov-report=term-missing

      - name: Golden-check CLI validate against qa_simple
        run: python -B -m scripts.qa_simple_golden_check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/
          retention-days: 7

      - name: Verify frontend codegen in sync
        # 校验 frontend/src/types/generated/actions.ts 与后端 registry 一致。
        # codegen.mjs 仅用 node 内置模块,无需 npm install。
        # 后端依赖已在上一步安装,registry 可 import。
        run: |
          node ../frontend/scripts/codegen.mjs
          if ! git diff --exit-code ../frontend/src/types/generated/; then
            echo "::error::前端 codegen 产物与后端 registry 不同步,请跑 'npm run codegen' 后提交"
            git diff -- ../frontend/src/types/generated/
            exit 1
          fi

  electron:
    name: Electron Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test

  release-scripts:
    name: Release Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 发布脚本纯逻辑单测（semver 比较/CHANGELOG 切版/latest.yml 解析）+ dry-run 冒烟
      - name: Unit tests
        run: npm run test:scripts

      - name: Dry-run smoke
        run: node scripts/release.mjs 99.0.0 --dry-run

  encoding-check:
    name: Script Encoding Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 确保 .ps1 脚本编码为 UTF-8，且含非 ASCII 字符的脚本必须带 UTF-8 BOM。
      # 历史上 enable-dev-mode.ps1 曾因 GBK 字节被当 UTF-8 读导致中文乱码（mojibake），
      # 编码校验防止同类问题重现。
      # BOM 要求（2026-09-05 实证修订）：Windows PowerShell 5.1（powershell -File，
      # package.json 的 pack/dist 脚本即此调用链）对无 BOM 文件按系统 ANSI 代码页
      # （zh-CN 为 GBK）解码，含中文的无 BOM 脚本会静默破坏解析——中文串字节吞掉
      # 相邻引号后整条语句被跳过（tsc 步骤曾整体未执行且退出码为 0）。带 BOM 对
      # PowerShell 5.1/7+ 与跨平台工具链（git/file 等）均无害；纯 ASCII 脚本不要求 BOM。
      - name: Check .ps1 encoding (non-ASCII requires UTF-8 BOM)
        run: |
          set -e
          fail=0
          for f in $(git ls-files '*.ps1'); do
            # file --mime-encoding 对纯 ASCII 报 us-ascii，对 UTF-8（含带 BOM）报 utf-8，两者都是合法 UTF-8 子集
            enc=$(file --mime-encoding "$f" | sed 's/.*: //')
            case "$enc" in
              utf-8|us-ascii)
                # 合法：UTF-8 或纯 ASCII（后者是 UTF-8 子集）
                ;;
              *)
                echo "::error::$f 编码为 $enc，应为 UTF-8"
                fail=1
                ;;
            esac
            # BOM（EF BB BF）与非 ASCII 字节判定（od 十六进制逐对锚定，无 PCRE 依赖；
            # 注意不能在拼接后的十六进制串上跑正则——CRLF 的 0d 0a 会拼出 "d0" 跨字节误配）
            bom=$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')
            if od -An -v -tx1 "$f" | tr -s ' ' '\n' | grep -qE '^[89a-f][0-9a-f]$'; then
              nonascii=yes
            else
              nonascii=no
            fi
            # 含非 ASCII 字符（中文注释/输出串）的脚本必须带 BOM，否则 Windows
            # PowerShell 5.1 按 ANSI(GBK) 解码会静默吞语句（见上方注释）
            if [ "$nonascii" = yes ] && [ "$bom" != efbbbf ]; then
              echo "::error::$f 含非 ASCII 字符但无 UTF-8 BOM——Windows PowerShell 5.1 会按 ANSI(GBK) 解码静默破坏脚本，请保存为 UTF-8 with BOM"
              fail=1
            fi
          done
          exit $fail

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: |
          cd ../frontend
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Python for backend
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          cd ../backend
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start backend server
        run: |
          cd ../backend
          python -m uvicorn app.api.main:app --host 0.0.0.0 --port 18000 &
          # 写入 .backend-port，供 Vite 代理（dynamic-backend-proxy）发现后端端口。
          # e2e 直接用 uvicorn 启动（不走 start_server.py，后者才会自动写端口文件），
          # 不写此文件会导致前端 dev server 代理返回 502，UI 测试无法访问后端。
          echo 18000 > ../backend/.backend-port
          for i in $(seq 1 30); do
            if curl -sf http://localhost:18000/health > /dev/null 2>&1; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 1
          done
          echo "Backend failed to start"
          exit 1

      - name: Start frontend dev server
        run: |
          cd ../frontend
          npm run dev &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 1
          done
          echo "Frontend failed to start"
          exit 1

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: 'http://localhost:5173'
          E2E_BACKEND_URL: 'http://localhost:18000'
          E2E_SKIP_WEB_SERVER: 'true'

      # 发布控制台（release-gui）页面测试：自起服务（端口 3311），不依赖前端/后端
      - name: Run Release GUI tests
        run: npx playwright test -c playwright.release-gui.config.ts

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload E2E screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: e2e/test-results/
          retention-days: 7

  electron-package:
    name: Electron Package (Windows)
    runs-on: windows-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build-only

      - name: Install electron dependencies
        run: npm ci

      - name: TypeScript compile
        run: npx tsc

      - name: Restore embedded Python runtime cache
        uses: actions/cache@v4
        with:
          path: electron/resources/python-runtime
          key: python-runtime-win-${{ hashFiles('electron/scripts/fetch-python.js', 'electron/scripts/install-backend-deps.js', 'backend/requirements.txt') }}

      - name: Fetch embedded Python runtime
        run: npm run fetch-python

      - name: Install backend dependencies into runtime
        run: npm run install:backend-deps

      - name: Package (directory)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        run: npx electron-builder --dir --win --publish never

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-win-package
          path: electron/release/
          retention-days: 7

  electron-package-mac:
    name: Electron Package (macOS)
    runs-on: macos-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build-only

      - name: Install electron dependencies
        run: npm ci

      - name: TypeScript compile
        run: npx tsc

      - name: Restore embedded Python runtime cache
        uses: actions/cache@v4
        with:
          path: electron/resources/python-runtime
          key: python-runtime-mac-${{ hashFiles('electron/scripts/fetch-python.js', 'electron/scripts/install-backend-deps.js', 'backend/requirements.txt') }}

      - name: Fetch embedded Python runtime
        run: npm run fetch-python

      - name: Install backend dependencies into runtime
        run: npm run install:backend-deps

      - name: Package (DMG)
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --config.mac.identity=null --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-mac-package
          path: electron/release/
          retention-days: 7

  electron-smoke:
    name: Electron Smoke (Windows packaged)
    runs-on: windows-latest
    needs: [electron-package]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Electron package artifact
        uses: actions/download-artifact@v4
        with:
          name: electron-win-package
          path: electron/release/

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Set Electron executable path
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path electron/release/win-unpacked -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "未找到 Electron 可执行文件 in electron/release/win-unpacked" }
          Write-Host "找到 Electron 可执行文件: $($exe.FullName)"
          echo "E2E_ELECTRON_PATH=$($exe.FullName)" >> $env:GITHUB_ENV

      - name: Run Electron smoke tests
        working-directory: e2e
        run: npx playwright test --config=playwright.electron.config.ts

      - name: Upload smoke results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-smoke-results
          path: e2e/test-results/
          retention-days: 7


