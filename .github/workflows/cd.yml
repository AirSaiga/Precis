name: CD - Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================================================
  # 0. 版本一致性守卫 —— tag 版本必须与全部 manifest（含插件双 JSON）全等（防人肉漏同步/漂移）。
  #    仅 tag 推送路径执行；workflow_dispatch 路径由各构建 job 内 sync 对齐。
  # ==========================================================================
  verify-manifests:
    name: Verify version manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Determine expected version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check manifests match tag version
        shell: bash
        run: node scripts/release.mjs check "${{ steps.version.outputs.version }}"

  # ==========================================================================
  # 1. GUI（Electron）—— 保持原有逻辑，win NSIS + mac DMG，直接 --publish always
  # ==========================================================================
  build-electron:
    name: Build Electron (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify-manifests
    if: always() && (needs.verify-manifests.result == 'success' || needs.verify-manifests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
          - platform: macos-arm64
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Determine and sync version
        shell: bash
        # tag 推送：版本已由 npm run release 统一写入全部 manifest（verify-manifests job 守卫），
        # 不再覆写，漂移即 fail；workflow_dispatch：用 release.mjs sync 对齐（仅影响本次构建产物）
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/release.mjs sync "${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "Building version: ${VERSION} (manifests already synced by release script)"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # Windows 路径
      - name: Build & publish (Windows)
        if: matrix.platform == 'windows-x64'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
        # npm workspaces：前端与 Electron 依赖统一在根目录一次安装
        run: |
          npm ci
          cd frontend
          npm run build-only
          cd ../electron
          npm run build:electron
          npm run fetch-python
          npm run install:backend-deps
          npx electron-builder --win --publish always

      # macOS 路径（禁用签名，Alpha 阶段）
      - name: Build & publish (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          cd frontend
          npm run build-only
          cd ../electron
          npm run build:electron
          npm run fetch-python
          npm run install:backend-deps
          npx electron-builder --mac --config.mac.identity=null --publish always

  # ==========================================================================
  # 2. CLI —— 源码 + python-runtime 自包含 zip/tar.gz（替代已废弃的 PyInstaller）
  # ==========================================================================
  build-cli:
    name: Build CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: verify-manifests
    if: always() && (needs.verify-manifests.result == 'success' || needs.verify-manifests.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            archive: zip
          - platform: macos-arm64
            runner: macos-latest
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        # dispatch 路径顺带 sync（保证包内 backend 版本与产物名一致）；tag 路径 manifest 已同步
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            node scripts/release.mjs sync "${VERSION}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch python-runtime
        shell: bash
        run: |
          mkdir -p staging/precis-cli/python-runtime
          node electron/scripts/fetch-python.js --out staging/precis-cli/python-runtime

      - name: Install backend deps into runtime
        shell: bash
        run: |
          node electron/scripts/install-backend-deps.js \
            --runtime staging/precis-cli/python-runtime \
            --requirements backend/requirements.txt

      - name: Copy backend source (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        # 用 PowerShell 原生 Copy-Item 递归拷贝，带排除过滤。
        # 避开 robocopy 的 exit code 陷阱（其成功码 1 会被 pwsh 当失败）。
        run: |
          $src = "backend"
          $dst = "staging/precis-cli/backend"
          $excludeDirs = @('__pycache__','.mypy_cache','.pytest_cache','.ruff_cache','build','dist','tests','.git')
          $excludeFiles = @('.coverage','.gitignore')
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Get-ChildItem -Path $src -Recurse -Force |
            Where-Object {
              $rel = $_.FullName.Substring((Resolve-Path $src).Path.Length).TrimStart('\','/')
              $parts = $rel -split '[\\/]'
              # 排除：任一路径段命中排除目录、或文件名/扩展名命中排除规则
              $hitDir = $false
              foreach ($p in $parts) { if ($excludeDirs -contains $p) { $hitDir = $true; break } }
              if ($hitDir) { return $false }
              if (-not $_.PSIsContainer) {
                if ($excludeFiles -contains $_.Name) { return $false }
                if ($_.Extension -eq '.log') { return $false }
                if ($_.Name -match '\.egg-info$') { return $false }
              }
              return $true
            } |
            ForEach-Object {
              $rel = $_.FullName.Substring((Resolve-Path $src).Path.Length).TrimStart('\','/')
              $target = Join-Path $dst $rel
              if ($_.PSIsContainer) {
                New-Item -ItemType Directory -Path $target -Force | Out-Null
              } else {
                $parent = Split-Path $target -Parent
                if (-not (Test-Path $parent)) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
                Copy-Item $_.FullName $target -Force
              }
            }
          Write-Host "backend source copied to $dst"

      - name: Copy backend source (macOS)
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p staging/precis-cli/backend
          rsync -a \
            --exclude='__pycache__' \
            --exclude='.mypy_cache' \
            --exclude='.pytest_cache' \
            --exclude='.ruff_cache' \
            --exclude='.coverage' \
            --exclude='*.egg-info' \
            --exclude='build/' \
            --exclude='dist/' \
            --exclude='tests/' \
            --exclude='.git' \
            --exclude='.gitignore' \
            --exclude='*.log' \
            backend/ staging/precis-cli/backend/

      - name: Generate entry point (Windows)
        if: matrix.platform == 'windows-x64'
        shell: bash
        # NOTE: printf 逐行写入，避免 heredoc 在 YAML run 块里的缩进污染
        # （heredoc 会把 YAML 缩进空格原样写进文件，破坏 bat 的 @echo off 和 shebang）。
        # 内容与 scripts/build-cli.ps1 中的 precis.bat 保持一致。
        run: |
          {
            printf '%s\n' '@echo off'
            printf '%s\n' 'chcp 65001 >nul'
            printf '%s\n' 'setlocal'
            printf '%s\n' 'rem Precis CLI entry - invokes bundled python -m app.cli'
            printf '%s\n' 'set "PKG_ROOT=%~dp0"'
            printf '%s\n' 'set "PYTHON=%PKG_ROOT%python-runtime\python\python.exe"'
            printf '%s\n' 'set "BACKEND_DIR=%PKG_ROOT%backend"'
            printf '%s\n' 'if not exist "%PYTHON%" ('
            printf '%s\n' '    echo [ERROR] Bundled Python not found: %PYTHON%'
            printf '%s\n' '    exit /b 1'
            printf '%s\n' ')'
            printf '%s\n' 'rem cwd=backend/ so Python can import the app package'
            printf '%s\n' 'cd /d "%BACKEND_DIR%"'
            printf '%s\n' '"%PYTHON%" -B -m app.cli %*'
            printf '%s\n' 'exit /b %ERRORLEVEL%'
          } > staging/precis-cli/precis.bat

      - name: Generate entry point (macOS)
        if: matrix.platform == 'macos-arm64'
        shell: bash
        # printf 避免缩进污染（同上）。shebang 必须在第 1 列。
        run: |
          {
            printf '%s\n' '#!/usr/bin/env bash'
            printf '%s\n' '# Precis CLI entry - invokes bundled python3 -m app.cli'
            printf '%s\n' 'set -euo pipefail'
            printf '%s\n' 'PKG_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"'
            printf '%s\n' 'PYTHON="${PKG_ROOT}/python-runtime/bin/python3"'
            printf '%s\n' 'BACKEND_DIR="${PKG_ROOT}/backend"'
            printf '%s\n' 'if [[ ! -x "${PYTHON}" ]]; then'
            printf '%s\n' '    echo "[ERROR] Bundled Python not found: ${PYTHON}" >&2'
            printf '%s\n' '    exit 1'
            printf '%s\n' 'fi'
            printf '%s\n' 'cd "${BACKEND_DIR}"'
            printf '%s\n' 'exec "${PYTHON}" -B -m app.cli "$@"'
          } > staging/precis-cli/precis
          chmod +x staging/precis-cli/precis

      - name: Package (Windows zip)
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          ARTIFACT="precis-cli-${{ steps.version.outputs.version }}-windows-x64.zip"
          # 用 PowerShell Compress-Archive（windows runner 必有，7z 不再可靠预装）
          powershell -NoProfile -Command "Compress-Archive -Path staging/precis-cli/* -DestinationPath '${ARTIFACT}' -CompressionLevel Optimal -Force"
          echo "Artifact: ${ARTIFACT}"
          ls -lh "${ARTIFACT}"

      - name: Package (macOS tar.gz)
        if: matrix.platform == 'macos-arm64'
        shell: bash
        run: |
          cd staging
          ARTIFACT="precis-cli-${{ steps.version.outputs.version }}-macos-arm64.tar.gz"
          tar -czf "../${ARTIFACT}" precis-cli
          cd ..
          echo "Artifact: ${ARTIFACT}"
          ls -lh "${ARTIFACT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: precis-cli-${{ matrix.platform }}
          path: |
            precis-cli-${{ steps.version.outputs.version }}-windows-x64.zip
            precis-cli-${{ steps.version.outputs.version }}-macos-arm64.tar.gz
          retention-days: 5
          if-no-files-found: error

  # ==========================================================================
  # 2b. PyPI —— precis-cli wheel + sdist（pip install precis-cli 分发链）。
  #     仅 tag 推送路径发布：PyPI 版本不可重传，workflow_dispatch 演练不得触发。
  #     前置（一次性，人工配置）：pypi.org → Account settings → Publishing →
  #     Add a new pending publisher：owner=AirSaiga, repository=Precis,
  #     workflow=cd.yml, environment 留空。未配置前本 job 会在 publish 步骤失败。
  #     冒烟先于发布（PyPI 上传永久生效）：干净 venv 装 wheel，验证 --version、
  #     demo 项目 8 违规基线与退出码 1，全过才 publish。
  # ==========================================================================
  pypi:
    name: Publish precis-cli to PyPI
    runs-on: ubuntu-latest
    needs: verify-manifests
    if: github.event_name == 'push' && needs.verify-manifests.result == 'success'
    permissions:
      # PyPI trusted publishing（OIDC）要求 id-token 写权限；顶层 contents:write 不覆盖 job 级
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheel + sdist
        working-directory: backend
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Smoke test wheel before publish
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/wheel-smoke
          WHEEL=$(ls backend/dist/precis_cli-*.whl)
          /tmp/wheel-smoke/bin/pip install --quiet "$WHEEL"
          OUT="$(/tmp/wheel-smoke/bin/precis --version)"
          echo "precis --version -> $OUT"
          case "$OUT" in
            *"$EXPECTED_VERSION"*) ;;
            *) echo "::error::wheel 版本不匹配（期望含 $EXPECTED_VERSION）"; exit 1 ;;
          esac
          set +e
          /tmp/wheel-smoke/bin/precis validate \
            --manifest demo/precis-project/project.precis.yaml --format json > /tmp/payload.json
          CODE=$?
          set -e
          [ "$CODE" -eq 1 ] || { echo "::error::demo 校验期望退出码 1（发现违规），实际 $CODE"; exit 1; }
          python - <<'PY'
          import json

          payload = json.load(open("/tmp/payload.json", encoding="utf-8"))
          assert payload["schema_version"] == 1, payload["schema_version"]
          assert payload["is_valid"] is False
          # demo 项目验收基准：恰好 8 处违规（与 MCP 集成测试同口径）
          assert len(payload["errors"]) == 8, f"期望 8 处违规，实际 {len(payload['errors'])}"
          print("smoke: installed wheel reproduces demo 8-violation baseline")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist

  # ==========================================================================
  # 3. Release —— 汇总产物，生成 checksums，自动 publish Release（非 draft：
  #    draft 对 electron-updater 不可见，客户端将检测不到更新）+ 产物自检闸门
  # ==========================================================================
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-manifests, build-cli, build-electron]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG="v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Detect prerelease
        id: meta
        run: |
          # 版本号含 prerelease 后缀（如 0.2.0-alpha.1）时标记为 GitHub prerelease
          if [[ "${{ steps.version.outputs.version }}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG
        run: |
          node scripts/extract-release-notes.mjs "${{ steps.version.outputs.version }}" > release-notes.md
          echo "=== Release notes head ==="
          head -20 release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: |
          echo "=== Downloaded artifacts ==="
          ls -lhR release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          # 排除 electron-builder 的 blockmap/yml（只给实际产物算 checksum）
          # CLI 是 zip/tar.gz；GUI 是 electron-builder 直接 --publish 的，不在此处（TUI 已停发，不随 Release 构建）
          find . -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec sha256sum {} \; > checksums-${{ steps.version.outputs.version }}.txt
          echo "=== Checksums ==="
          cat checksums-${{ steps.version.outputs.version }}.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Precis v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 产物自检闸门：latest.yml 引用的每个文件必须在 Release 资产中存在且
      # size/sha512 实测一致（历史出过命名漂移导致客户端更新 404，见 scripts/verify-release-assets.mjs 头注）
      - name: Verify release assets (auto-update integrity gate)
        run: |
          node scripts/verify-release-assets.mjs \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --version "${{ steps.version.outputs.version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
